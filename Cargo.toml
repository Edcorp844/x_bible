[package]
name = "x_bible"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
relm4 = { version = "0.11.0", features = ["all"] }
relm4-components = { version = "0.11.0", features = ["libadwaita", "reqwest"] }
thiserror = "2.0.17"
directories = "6.0.0"
relm4-icons = "0.11.0"
xbible_engine = { git = "https://github.com/Edcorp844/xbible_engine.git"}
rodio = "0.22.2"
async-channel = "2.5.0"
log = "0.4.33"
glib = "0.22.11"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
serde_json = "1.0.154"
serde = "1.0.229"


[build-dependencies]
glib-build-tools = "0.22.8"
